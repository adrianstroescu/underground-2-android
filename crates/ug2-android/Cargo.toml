[package]
name = "ug2-android"
description = "Android entry point (NativeActivity)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ug2"
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
ug2-engine.workspace = true
log.workspace = true
raw-window-handle.workspace = true
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
ndk = { version = "0.9", features = ["audio", "nativewindow", "api-level-30"] }
