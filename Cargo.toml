[workspace]
resolver = "2"
members = [
    "crates/ug2-formats",
    "crates/ug2-tool",
    "crates/ug2-audio",
    "crates/ug2-movie",
    "crates/ug2-engine",
    "crates/ug2-desktop",
    "crates/ug2-android",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/adrianstroescu/underground-2-android"

[workspace.dependencies]
ug2-formats = { path = "crates/ug2-formats" }
ug2-engine = { path = "crates/ug2-engine" }
ug2-audio = { path = "crates/ug2-audio" }
ug2-movie = { path = "crates/ug2-movie" }
# The VP6 decoder of NihAV, relicensed MIT for Ruffle.
nihav_core = { git = "https://github.com/ruffle-rs/nihav-vp6", rev = "12d0bdf10a85641dc2de3d6900c747894431ed77" }
nihav_codec_support = { git = "https://github.com/ruffle-rs/nihav-vp6", rev = "12d0bdf10a85641dc2de3d6900c747894431ed77" }
nihav_duck = { git = "https://github.com/ruffle-rs/nihav-vp6", rev = "12d0bdf10a85641dc2de3d6900c747894431ed77" }
# Vulkan only: Android target; DX12 also breaks windows-gnu dev builds.
wgpu = { version = "25", default-features = false, features = ["vulkan", "wgsl"] }
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
anyhow = "1"
pollster = "0.4"
png = "0.17"
raw-window-handle = "0.6"
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }

[profile.dev]
opt-level = 1

# Asset decoding (JDLZ/HUFF/DXT) is painfully slow unoptimized.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
debug = false

# Quick device builds while iterating (no LTO, incremental); release is for deliveries.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
